  <section class="kopf-schlicht">
    <div class="sheet">
      {{> brotkrumen}}
      <h1 style="margin-top:clamp(6px,1vw,14px)">{{kopf.h1}}</h1>
      <p class="lead">{{kopf.lead}}</p>
    </div>
  </section>
  <section class="sec on-light sec-after-head">
    <div class="sheet">
      <div class="split rev">
        <div class="prose">
          <h2>{{staedte.titel}}</h2>
          <p>{{staedte.text}}</p>
          {{> orte}}
        </div>
        {{> karte_einsatzgebiet}}
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sheet">
      <div class="split single">
        <div class="prose"><h2>{{referenzen_hinweis.titel}}</h2>
        <p>{{referenzen_hinweis.text}}</p>
        <a class="btn btn-line" href="{{link.referenzen}}">{{referenzen_hinweis.button}} {{> pfeil}}</a></div>
      </div>
    </div>
  </section>
  {{> cta_band}}
