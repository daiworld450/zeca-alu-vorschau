<div class="formblatt" id="anfrage">
          <h3 class="panel-title">{{formular.titel}}</h3>
          <form id="kontaktformular" action="{{formular.aktion}}" method="POST">
            <input type="hidden" name="_subject" value="{{formular.betreff}}" />
            <p class="form-hint">Felder mit <span class="req" aria-hidden="true">*</span><span class="sr-only">Stern</span> sind Pflichtfelder. Lieber direkt sprechen? <a href="tel:{{tel.tel}}">{{tel.anzeige}}</a></p>
            <div class="form-grid">
              <div class="f full"><label for="name">Name <span class="req" aria-hidden="true">*</span></label><input id="name" name="Name" type="text" autocomplete="name" required /></div>
              <div class="f"><label for="tel">Telefon</label><input id="tel" name="Telefon" type="tel" autocomplete="tel" inputmode="tel" /></div>
              <div class="f"><label for="email">E-Mail <span class="req" aria-hidden="true">*</span></label><input id="email" name="E-Mail" type="email" autocomplete="email" required /></div>
              <div class="f full"><label for="leistung">Gewünschte Leistung</label>
                <select id="leistung" name="Leistung">
                  {{#jede nav.leistungen.eintraege}}<option>{{name}}</option>
                  {{/jede}}<option>{{formular.option_sonstiges}}</option>
                </select>
              </div>
              <div class="f full"><label for="nachricht">Nachricht <span class="req" aria-hidden="true">*</span></label><textarea id="nachricht" name="Nachricht" required></textarea></div>
            </div>
            <div class="formfoot">
              <button class="btn btn-block" type="submit">{{formular.button}}</button>
              <p class="form-note">{{formular.datenschutzhinweis}}</p>
              <div class="form-status" role="status" aria-live="polite"></div>
            </div>
          </form>
        </div>
