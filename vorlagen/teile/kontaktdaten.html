<div class="contact-info">
            <div class="row">{{> telefon_symbol}}<div><h3>Telefon</h3>{{#jede telefone}}<a href="tel:{{tel}}">{{anzeige}}</a>{{/jede}}</div></div>
            <div class="row">{{> mail_symbol}}<div><h3>E-Mail</h3><a href="mailto:{{email}}">{{email}}</a></div></div>
            <div class="row">{{> adresse_symbol}}<div><h3>Adresse</h3><p>{{strasse}}, {{plz}} {{ort}}</p></div></div>
          </div>
